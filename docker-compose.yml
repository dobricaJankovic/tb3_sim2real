# Two images, one DDS domain.
#
#   isaacsim  -> Ubuntu 24.04 (noble), Kit python 3.12, internal ROS 2 Humble libs.
#                Knows nothing about ROS packages. Just publishes/subscribes.
#   tb3_ros   -> Ubuntu 22.04 (jammy), system ROS 2 Humble, python 3.10.
#                Nav2, RViz, Gazebo Classic, real-robot drivers, our bringup package.
#
# They only ever talk over DDS. Both need the SAME ROS_DOMAIN_ID and a shared
# /dev/shm (ipc: host), or discovery works and data silently does not.
#
#   docker compose up -d isaacsim
#   docker compose run --rm tb3_ros

services:

  isaacsim:
    image: isaac-sim-docker:latest        # built from ~/isaacsim-6.0/tools/docker
    container_name: isaacsim
    entrypoint: /isaac-sim/runapp.sh      # GUI over X11; use runheadless.sh for WebRTC
    network_mode: host
    ipc: host
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - PRIVACY_USERID=${PRIVACY_EMAIL:-user@example.com}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Container runs as root, but host X access control is per-UID
      # (`SI:localuser:<you>`), so the X11 socket mount alone isn't enough —
      # GUI opens fail auth. XAUTHORITY here points at a cookie file docker/
      # x11-auth.sh generates on the host and re-keys under a wildcard family;
      # run that script before `docker compose up/run`.
      - XAUTHORITY=/root/.Xauthority
      # Verified against a live probe: leaving ROS_DISTRO unset does NOT make
      # isaacsim.ros2.core fall back cleanly — it logs "ROS2 Bridge startup
      # failed" (librmw_implementation.so -> missing libament_index_cpp.so)
      # and the bridge silently never talks DDS. Its own error message names
      # this exact fix. Also: the bundled distro is Jazzy, not Humble — that's
      # fine, FastDDS is wire-compatible across ROS 2 versions and tb3_ros
      # already defaults to rmw_fastrtps_cpp.
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${TB3_XAUTH:-/tmp/tb3_sim2real.docker.xauth}:/root/.Xauthority:ro
      - ./isaac/scenes:/scenes   # rw: build_scene.py's --save and the URDF importer both write here
      - ./isaac/scripts:/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    stdin_open: true
    tty: true

  tb3_ros:
    build:
      context: ./docker/ros
      dockerfile: Dockerfile
    image: tb3_sim2real/ros:humble
    # no container_name: we mostly `docker compose run --rm tb3_ros`, which
    # ignores it and warns. Use `docker compose exec` against `up -d` if you
    # want a stable name.
    network_mode: host
    ipc: host
    privileged: true                      # /dev/ttyACM0 + lidar USB for the real robot
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - LDS_MODEL=${LDS_MODEL:-LDS-02}
      # ros-humble-turtlebot3-gazebo ships no Gazebo-specific ament hook (only
      # the usual path.dsv/ament_prefix_path.dsv), so gzserver can't resolve
      # <uri>model://turtlebot3_world without this — a standard TurtleBot3
      # e-manual .bashrc step, needed here since the container has no .bashrc.
      # Prepended, not a replacement: it must stay alongside Gazebo's own
      # default /usr/share/gazebo-11/models, which is where model://ground_plane
      # and model://sun live. Setting this var wipes that default out, and with
      # GAZEBO_MODEL_DATABASE_URI emptied below there's no fallback fetch left
      # either — the robot spawns into a world with no ground plane and falls
      # through forever.
      - GAZEBO_MODEL_PATH=/opt/ros/humble/share/turtlebot3_gazebo/models:/usr/share/gazebo-11/models
      # gzserver's ModelDatabase does a synchronous fetch from
      # models.gazebosim.org on startup to refresh its local model cache
      # metadata, independent of GAZEBO_MODEL_PATH above. In this network it
      # hangs rather than failing fast, so /spawn_entity never comes up.
      # Emptying the URI skips it; models already resolve fine locally.
      - GAZEBO_MODEL_DATABASE_URI=
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # See the isaacsim service's XAUTHORITY comment above — same root-uid
      # vs per-UID X access control issue, same docker/x11-auth.sh fix.
      - XAUTHORITY=/root/.Xauthority
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${TB3_XAUTH:-/tmp/tb3_sim2real.docker.xauth}:/root/.Xauthority:ro
      - ./tb3_bringup:/ws/src/tb3_bringup   # edit on host, colcon build inside
    working_dir: /ws
    command: bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]         # gzserver/gzclient GLX rendering needs the real driver,
                                           # not the nouveau fallback picked up without this
