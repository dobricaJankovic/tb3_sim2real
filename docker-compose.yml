# One image, one container, one DDS domain.
#
#   tb3_ros -> Ubuntu 22.04 (jammy), ROS 2 Humble, python 3.10, AND Isaac Sim 6.0
#              at /isaac-sim. Nav2, RViz, Gazebo Classic, the real-robot drivers,
#              our bringup package, and the simulator, all in one place.
#
# This used to be two services that met only on the DDS wire, because a locally
# built Isaac Sim requires GLIBC_2.38 and jammy provides 2.35. NVIDIA's released
# build is compiled to 2.34 and runs here. See docs/architecture.md; verify.sh
# scores the base image 5/5.
#
#   ./docker/x11-auth.sh              # once per X session
#   scripts/build_images.sh           # base image, then this one
#   docker compose up -d              # start it; it stays up, caches stay warm
#   docker compose exec tb3_ros bash  # terminal 1
#   docker compose exec tb3_ros bash  # terminal 2, and so on
#
# `exec` does NOT run /entrypoint.sh -- only `run` does. An interactive shell
# gets away with it because /root/.bashrc sources ROS 2, but Ubuntu's stock
# root .bashrc returns early for non-interactive shells, so
#
#   docker compose exec tb3_ros bash -c 'ros2 topic list'
#
# lands in a container with no ros2 on PATH and fails quietly. For anything
# scripted, go through the entrypoint explicitly:
#
#   docker compose exec tb3_ros /entrypoint.sh bash -c 'ros2 topic list'
#
# Inside, `isaacsim` starts the GUI and `isaacsim-python <script>` runs a
# standalone app. Both go through ros-isolate, which is the ONLY correct way to
# start Kit from a shell that has sourced ROS 2 -- see docker/isaacsim-ros2/ros-isolate.

services:

  tb3_ros:
    build:
      context: ./docker/ros
      dockerfile: Dockerfile
      args:
        # Built by scripts/build_images.sh from docker/isaacsim-ros2/Dockerfile.humble.
        BASE_IMAGE: ${TB3_BASE_IMAGE:-isaacsim6-humble:ngc}
    image: tb3_sim2real/tb3_ros:humble
    container_name: tb3_ros
    network_mode: host
    privileged: true                      # /dev/ttyACM0 + lidar USB for the real robot

    # Deliberately NO `ipc: host`. carb (Kit's core) creates a POSIX shared
    # memory segment named after its own PID -- /dev/shm/carb-RStringInternals-<pid>
    # -- and that PID is deterministic across runs. With `ipc: host` it lands in
    # the HOST's sticky /dev/shm, where one stale root-owned file poisons that
    # exact name permanently and Kit aborts before it starts:
    #
    #   RStringInternals.inl:667 Assertion (false) failed:
    #     Failed to create shared memory named carb-RStringInternals-62
    #
    # A private IPC namespace makes the collision structurally impossible. This
    # was never about DDS, and merging the containers does not change it.

    environment:
      # Which environment tb3_sim.py loads, by registry name (worlds/<name>/).
      - WORLD=${WORLD:-turtlebot3_world}
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - PRIVACY_USERID=${PRIVACY_EMAIL:-user@example.com}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - LDS_MODEL=${LDS_MODEL:-LDS-02}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

      # ROS_DISTRO and the bundled-library path are NOT set here any more. The
      # old isaacsim service had to pin ROS_DISTRO=jazzy and point
      # LD_LIBRARY_PATH at exts/isaacsim.ros2.core/jazzy/lib by hand. ros-isolate
      # now derives both from ISAACSIM_ROS_DISTRO=humble, baked into the base
      # image, and only for the Kit process -- so the shell keeps the system
      # Humble and Kit gets its own. Setting ROS_DISTRO here would break the
      # shell's ROS 2.

      # ros-humble-turtlebot3-gazebo ships no Gazebo-specific ament hook, so
      # gzserver cannot resolve <uri>model://turtlebot3_world without this.
      # Prepended, not a replacement: /usr/share/gazebo-11/models is where
      # model://ground_plane and model://sun live, and wiping it out drops the
      # robot through a world with no ground plane. /worlds is first so the
      # registry's generated worlds resolve their own meshes as
      # model://<name>/meshes/... and stay free of absolute container paths.
      - GAZEBO_MODEL_PATH=/worlds:/opt/ros/humble/share/turtlebot3_gazebo/models:/usr/share/gazebo-11/models
      # gzserver's ModelDatabase does a synchronous fetch from models.gazebosim.org
      # on startup, independent of GAZEBO_MODEL_PATH. In this network it hangs
      # rather than failing fast and /spawn_entity never comes up. Emptying the
      # URI skips it; models already resolve locally.
      - GAZEBO_MODEL_DATABASE_URI=

      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Host X access control is per-UID (`SI:localuser:<you>`), so the socket
      # mount alone is not enough. docker/x11-auth.sh generates a cookie on the
      # host and re-keys it under a wildcard family; run it before `up`.
      #
      # ONE path now, not two. The split existed only because NVIDIA's image ends
      # `USER isaac-sim` (uid 1234) and could not traverse /root, while this image
      # runs as root. One image, one uid, one cookie.
      - XAUTHORITY=/root/.Xauthority

      # Still here, still UDP-only, and now probably unnecessary: Fast-DDS
      # creates its shared-memory segments 0700, which the old 1234-vs-root split
      # made mutually unreadable, so discovery worked and data silently did not.
      # With one uid that reason is gone. Removing it is its own change, with its
      # own test -- see docs/history.md.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fastdds_udp_only.xml

    volumes:
      - ./docker/fastdds_udp_only.xml:/etc/fastdds_udp_only.xml:ro
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${TB3_XAUTH:-/tmp/tb3_sim2real.docker.xauth}:/root/.Xauthority:ro
      - ./tb3_bringup:/ws/src/tb3_bringup   # edit on host, colcon build inside
      - ./isaac/scenes:/scenes              # rw: the URDF importer writes here
      - ./isaac/scripts:/scripts:ro
      # rw, unlike the old tb3_ros mount: the Isaac side generates <name>.usd
      # back beside the manifest, and that side now lives in this container.
      - ./worlds:/worlds

      # --- Kit caches ---------------------------------------------------------
      # Measured on 2026-09-13 by diffing the filesystem across a cold
      # tb3_sim.py run, not copied from NVIDIA's compose file -- theirs mounts
      # four $HOME-relative paths, which is right for an image whose user's home
      # IS /isaac-sim and wrong here, where HOME=/root. The big one is not
      # $HOME-relative at all:
      #
      #   493 MB  /isaac-sim/kit/cache        shader cache
      #   6.3 MB  /root/.nv/ComputeCache      CUDA
      #   1.4 MB  /var/tmp/OptixCache_root    OptiX, i.e. the RTX lidar
      #
      # Measured effect: /scan appears 164-168 s after launch cold (three runs)
      # and 14 s warm (two runs). That 12x is the entire argument for this
      # block. Note it belongs to the VOLUMES, not to `up -d` -- `docker compose
      # run --rm` gets the same warm cache, and also keeps the entrypoint, which
      # `exec` does not.
      # The ~46 MB of .pyc Kit scatters through /isaac-sim is deliberately NOT
      # persisted: regenerating it is seconds of CPU, and covering it would mean
      # volume-mounting the whole 25 GB install tree.
      - isaac_kit_cache:/isaac-sim/kit/cache
      - isaac_compute_cache:/root/.nv/ComputeCache
      - isaac_optix_cache:/var/tmp
      # Kit's own logs, for the same reason ros_logs exists: the failures here
      # are usually the silent kind you can only diagnose afterwards.
      - isaac_kit_logs:/isaac-sim/kit/logs

      # ROS logs. A named volume rather than a bind mount, deliberately: this
      # container runs as root, so a bind mount would create a root:root
      # directory inside the repo that you cannot delete without sudo.
      #   docker compose exec tb3_ros ls /root/.ros/log
      #   docker volume rm tb3_sim2real_ros_logs
      - ros_logs:/root/.ros

    working_dir: /ws
    command: sleep infinity      # `up -d` keeps it alive; attach with `exec`
    # `sleep infinity` as PID 1 does not reap children, and Kit leaves plenty:
    # a killed simulator left a trail of `python3 <defunct>` behind on the first
    # run of this file. init: true puts docker-init in front so they get reaped.
    init: true
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  ros_logs:
  isaac_kit_cache:
  isaac_compute_cache:
  isaac_optix_cache:
  isaac_kit_logs:
