# Two images, one DDS domain.
#
#   isaacsim  -> Ubuntu 24.04 (noble), Kit python 3.12, internal ROS 2 Humble libs.
#                Knows nothing about ROS packages. Just publishes/subscribes.
#   tb3_ros   -> Ubuntu 22.04 (jammy), system ROS 2 Humble, python 3.10.
#                Nav2, RViz, Gazebo Classic, real-robot drivers, our bringup package.
#
# They only ever talk over DDS. Both need the SAME ROS_DOMAIN_ID and a shared
# /dev/shm (ipc: host), or discovery works and data silently does not.
#
#   docker compose up -d isaacsim
#   docker compose run --rm tb3_ros

services:

  isaacsim:
    image: isaac-sim-docker:latest        # built from ~/isaacsim-6.0/tools/docker
    container_name: isaacsim
    entrypoint: /isaac-sim/runapp.sh      # GUI over X11; use runheadless.sh for WebRTC
    network_mode: host
    ipc: host
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - PRIVACY_USERID=${PRIVACY_EMAIL:-user@example.com}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # ROS_DISTRO deliberately unset -> isaacsim.ros2.core falls back to its
      # bundled Humble libs (internal_lib_fallback=True). This is the supported path.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./isaac/scenes:/scenes:ro
      - ./isaac/scripts:/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    stdin_open: true
    tty: true

  tb3_ros:
    build:
      context: ./docker/ros
      dockerfile: Dockerfile
    image: tb3_sim2real/ros:humble
    # no container_name: we mostly `docker compose run --rm tb3_ros`, which
    # ignores it and warns. Use `docker compose exec` against `up -d` if you
    # want a stable name.
    network_mode: host
    ipc: host
    privileged: true                      # /dev/ttyACM0 + lidar USB for the real robot
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - LDS_MODEL=${LDS_MODEL:-LDS-02}
      # ros-humble-turtlebot3-gazebo ships no Gazebo-specific ament hook (only
      # the usual path.dsv/ament_prefix_path.dsv), so gzserver can't resolve
      # <uri>model://turtlebot3_world without this — a standard TurtleBot3
      # e-manual .bashrc step, needed here since the container has no .bashrc.
      - GAZEBO_MODEL_PATH=/opt/ros/humble/share/turtlebot3_gazebo/models
      # gzserver's ModelDatabase does a synchronous fetch from
      # models.gazebosim.org on startup to refresh its local model cache
      # metadata, independent of GAZEBO_MODEL_PATH above. In this network it
      # hangs rather than failing fast, so /spawn_entity never comes up.
      # Emptying the URI skips it; models already resolve fine locally.
      - GAZEBO_MODEL_DATABASE_URI=
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./tb3_bringup:/ws/src/tb3_bringup   # edit on host, colcon build inside
    working_dir: /ws
    command: bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]         # gzserver/gzclient GLX rendering needs the real driver,
                                           # not the nouveau fallback picked up without this
