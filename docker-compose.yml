# Two images, one DDS domain.
#
#   isaacsim  -> Ubuntu 24.04 (noble), Kit python 3.12, internal ROS 2 Humble libs.
#                Knows nothing about ROS packages. Just publishes/subscribes.
#   tb3_ros   -> Ubuntu 22.04 (jammy), system ROS 2 Humble, python 3.10.
#                Nav2, RViz, Gazebo Classic, real-robot drivers, our bringup package.
#
# They only ever talk over DDS, and they need the SAME ROS_DOMAIN_ID.
#
# They do NOT need a shared /dev/shm. That was the original design and this
# comment used to say `ipc: host` was required "or discovery works and data
# silently does not" — but docker/fastdds_udp_only.xml, added later, disables
# Fast-DDS's shared-memory transport outright (useBuiltinTransports=false,
# UDPv4 only) because the two containers run as different uids and Fast-DDS
# creates its segments 0700. With SHM off on both sides, sharing /dev/shm
# carried no data and only created collisions — see the isaacsim service.
#
# BOTH services are network_mode: host, and that has to stay symmetric. The
# official ROS image docs warn that host networking "removes the networking
# namespace separation between containers, and can affect the ability of DDS
# participants to communicate between containers" — that warning is about
# *mixing* the two. Because both sit in the host namespace they behave as one
# machine and discovery works. Move either service onto a bridge network and
# the pairing breaks in the usual silent way: topics discovered, no data.
#
#   ./docker/x11-auth.sh                 # once per X session, before either
#   docker compose run --rm isaacsim     # the simulator; leave it running
#   docker compose run --rm tb3_ros      # second terminal, then bringup
#
# For a bare Isaac Sim GUI with no scene (poking at stages by hand):
#   docker compose run --rm --entrypoint /isaac-sim/runapp.sh isaacsim

services:

  isaacsim:
    image: isaac-sim-docker:latest        # built from ~/isaacsim-6.0/tools/docker
    container_name: isaacsim
    # tb3_sim.py IS the simulator launcher — it boots Kit, opens the stage,
    # builds the ROS 2 graph and calls play(), the way gazebo.launch.py starts
    # gzserver/gzclient. runapp.sh (the bare GUI) only opens an empty stage and
    # publishes nothing, so it is not the default; override the entrypoint when
    # you actually want it.
    entrypoint: /isaac-sim/python.sh
    command: /scripts/tb3_sim.py
    network_mode: host
    # Deliberately NO `ipc: host` — this container gets its own /dev/shm.
    #
    # carb (Kit's core) creates a POSIX shared-memory segment named after its
    # own PID: /dev/shm/carb-RStringInternals-<pid>. Under python.sh that PID is
    # deterministically 62 nearly every run. With `ipc: host` that lands in the
    # HOST's /dev/shm, which is sticky (drwxrwxrwt) and shared with every other
    # container and with anything that ever ran Kit as root. This service runs
    # as uid 1234 (NVIDIA's image ends `USER isaac-sim`), so a root-owned
    # leftover at that exact name can be neither reused nor unlinked, and Kit
    # aborts before it starts:
    #
    #   RStringInternals.inl:667 Assertion (false) failed:
    #     Failed to create shared memory named carb-RStringInternals-62
    #   terminate called without an active exception
    #
    # Because the name is PID-derived and the PID repeats, one stale root-owned
    # file poisons that slot permanently — every subsequent run fails the same
    # way. A private IPC namespace makes the collision structurally impossible.
    #
    # Nothing needed the shared /dev/shm: DDS is UDP-only (see the profiles file
    # below) and MIT-SHM is off (QT_X11_NO_MITSHM=1). No shm_size override
    # either — NVIDIA's own tools/docker/run_docker.sh passes --network=host
    # with no --ipc and no --shm-size, so Kit is known to run on the 64 MB
    # default.
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - PRIVACY_USERID=${PRIVACY_EMAIL:-user@example.com}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Host X access control is per-UID (`SI:localuser:<you>`), so the X11
      # socket mount alone isn't enough — GUI opens fail auth. XAUTHORITY
      # points at a cookie docker/x11-auth.sh generates on the host and re-keys
      # under a wildcard family; run that script before `docker compose up/run`.
      #
      # NOT /root/.Xauthority (which is what tb3_ros uses): NVIDIA's Dockerfile
      # ends with `USER isaac-sim`, so this container runs as uid 1234, not
      # root, and cannot traverse /root. Mounting there fails silently — Kit
      # logs "GLFW initialization failed" / "IAppWindow::startup failed" and
      # runs on with no window, while the healthcheck still reports healthy
      # because it only greps the log for AppReady. /tmp is chowned to
      # isaac-sim by the image, so the cookie is readable here.
      - XAUTHORITY=/tmp/.docker.xauth
      # Verified against a live probe: leaving ROS_DISTRO unset does NOT make
      # isaacsim.ros2.core fall back cleanly — it logs "ROS2 Bridge startup
      # failed" (librmw_implementation.so -> missing libament_index_cpp.so)
      # and the bridge silently never talks DDS. Its own error message names
      # this exact fix. The variable SELECTS a bundle, it does not rescue one:
      # the extension defaults to `ros_distro = "system_default"`, i.e. it reads
      # ROS_DISTRO and picks a directory under exts/isaacsim.ros2.core/, and
      # unset it resolves nothing.
      #
      # NOT "the bundled distro is Jazzy, not Humble" (what this said before) —
      # the image ships BOTH humble/ and jazzy/, and with LD_LIBRARY_PATH aimed
      # at either, every dependency of librmw_fastrtps_cpp.so resolves. Humble
      # would likely work. Jazzy is chosen because this image is Ubuntu 24.04
      # (noble) and Jazzy is noble's distro, so it matches the container's own
      # libraries. Mixing with tb3_ros's Humble is fine: FastDDS is wire
      # compatible, the message types we use are unchanged between the two, and
      # tb3_ros already defaults to rmw_fastrtps_cpp. The cost is that Jazzy's
      # discovery type hashes mean nothing to Humble, so a genuinely divergent
      # message definition would surface as garbage, not as an error.
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
      # This container is uid 1234 and tb3_ros is root, so Fast-DDS's 0700
      # shared-memory segments are mutually unreadable and the data path dies
      # silently while discovery keeps working. See the XML for the full story.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fastdds_udp_only.xml
    volumes:
      - ./docker/fastdds_udp_only.xml:/etc/fastdds_udp_only.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${TB3_XAUTH:-/tmp/tb3_sim2real.docker.xauth}:/tmp/.docker.xauth:ro
      - ./isaac/scenes:/scenes   # rw: the URDF importer writes the asset and world stage here
      - ./isaac/scripts:/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    stdin_open: true
    tty: true

  tb3_ros:
    build:
      context: ./docker/ros
      dockerfile: Dockerfile
    image: tb3_sim2real/ros:humble
    # no container_name: we mostly `docker compose run --rm tb3_ros`, which
    # ignores it and warns. Use `docker compose exec` against `up -d` if you
    # want a stable name.
    network_mode: host
    ipc: host
    privileged: true                      # /dev/ttyACM0 + lidar USB for the real robot
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - LDS_MODEL=${LDS_MODEL:-LDS-02}
      # ros-humble-turtlebot3-gazebo ships no Gazebo-specific ament hook (only
      # the usual path.dsv/ament_prefix_path.dsv), so gzserver can't resolve
      # <uri>model://turtlebot3_world without this — a standard TurtleBot3
      # e-manual .bashrc step, needed here since the container has no .bashrc.
      # Prepended, not a replacement: it must stay alongside Gazebo's own
      # default /usr/share/gazebo-11/models, which is where model://ground_plane
      # and model://sun live. Setting this var wipes that default out, and with
      # GAZEBO_MODEL_DATABASE_URI emptied below there's no fallback fetch left
      # either — the robot spawns into a world with no ground plane and falls
      # through forever.
      - GAZEBO_MODEL_PATH=/opt/ros/humble/share/turtlebot3_gazebo/models:/usr/share/gazebo-11/models
      # gzserver's ModelDatabase does a synchronous fetch from
      # models.gazebosim.org on startup to refresh its local model cache
      # metadata, independent of GAZEBO_MODEL_PATH above. In this network it
      # hangs rather than failing fast, so /spawn_entity never comes up.
      # Emptying the URI skips it; models already resolve fine locally.
      - GAZEBO_MODEL_DATABASE_URI=
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Same per-UID X access control issue and same docker/x11-auth.sh fix as
      # the isaacsim service above, but this image does run as root, so /root
      # is a fine place for the cookie. That is the only reason the two
      # services mount it at different paths.
      - XAUTHORITY=/root/.Xauthority
      # Must match the isaacsim service — see that service's comment and
      # docker/fastdds_udp_only.xml.
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fastdds_udp_only.xml
    volumes:
      - ./docker/fastdds_udp_only.xml:/etc/fastdds_udp_only.xml:ro
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${TB3_XAUTH:-/tmp/tb3_sim2real.docker.xauth}:/root/.Xauthority:ro
      - ./tb3_bringup:/ws/src/tb3_bringup   # edit on host, colcon build inside
      # ROS writes its logs to ~/.ros, which is /root/.ros for this image. We
      # mostly `run --rm`, so without this every log is destroyed on exit — and
      # the failures here are usually the silent kind you can only diagnose
      # afterwards.
      #
      # A named volume rather than a bind mount, deliberately: this container
      # runs as root, so a bind mount would create a root:root directory inside
      # the repo that you cannot delete without sudo. Read the logs with
      #   docker compose run --rm tb3_ros ls /root/.ros/log
      # and discard them with
      #   docker volume rm tb3_sim2real_ros_logs
      - ros_logs:/root/.ros
    working_dir: /ws
    command: bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]         # gzserver/gzclient GLX rendering needs the real driver,
                                           # not the nouveau fallback picked up without this

volumes:
  # ROS log directory for tb3_ros; see that service's volumes entry.
  ros_logs:
