# turtlebot3_world — the standard TurtleBot3 Nav2 arena.
#
# THIS FILE IS THE SOURCE OF TRUTH. The Gazebo .world and the Isaac Sim .usd are
# both GENERATED from it, so the two simulators cannot drift apart:
#
#   scripts/build_world.sh <name>   -> <name>.world      (SDF, committed)
#                                   -> isaac/<name>.usd  (gitignored)
#
# Edit this, then regenerate both. Never hand-edit a generated file:
# scripts/check_worlds.py records this file's hash in the .world header and
# fails if the two stop matching.
#
# The geometry under meshes/ is shared byte-for-byte between the two backends —
# that is the whole point of the layout. Only the wrappers differ.
#
# The meshes are OBJ, converted once from upstream's Collada by
# scripts/dae_to_obj.py with the declared inch unit baked into the vertices.
# Isaac Sim 6.1's asset converter does not read .dae at all, so this is not a
# preference: a Collada world builds for Gazebo and cannot be built for Isaac
# Sim. OBJ also carries no unit and no up-axis header for the two backends to
# disagree about, which is the trap these particular files embody.
#
# Derived mechanically from turtlebot3_gazebo's models/turtlebot3_world/model.sdf
# (ros-humble-turtlebot3-gazebo) so the placements are upstream's, not retyped.

name: turtlebot3_world
description: >-
  ROBOTIS' standard TurtleBot3 arena: a hexagonal wall enclosing nine cylindrical
  obstacles on a 3x3 grid, with five decorative hexagons outside the wall.

# Where the robot starts. Matches turtlebot3_world.launch.py's x_pose/y_pose, so
# Gazebo, Isaac Sim and real runs are comparable from the same initial pose.
spawn:
  xyz: [-2.0, -0.5, 0.01]
  yaw: 0.0

# The Nav2 map of this environment, used by every backend. Upstream's recording
# of the real arena, out of turtlebot3_navigation2; its frame coincides with the
# world origin, so `spawn` above is also the initial pose to hand AMCL.
map: map/map.yaml

# Every body here is STATIC (upstream sets <static>1</static>): collider plus
# visual, no rigid-body dynamics. Generators must not attach a rigid body.
#
# Mesh collisions must stay EXACT (triangle mesh), never a convex hull: the wall
# is a thin hexagonal shell whose convex hull is a solid prism, which would seal
# the robot inside the arena at spawn.

# Expected world-space bounding box of the assembled stage, in metres.
# build_world_usd.py checks the generated USD against this and fails loudly if
# it disagrees. Optional per world, strongly advised for any world with a mesh
# in it: it is the only thing that catches a scale or axis misread, and both
# produce a stage that loads without complaint.
#
# It has now caught two, neither of which reported an error of its own:
#
#   - The asset converter authors converted layers in CENTIMETRES by default,
#     so an OBJ in metres arrives 100x too small. (use_meter_as_world_unit.)
#   - Collada declares a unit and an up axis and these files get both
#     "wrong": `<unit name="inch" meter="0.0254"/>` and `up_axis Y_UP`, while
#     the vertices are laid out Z-up. Gazebo ignores the axis and applies the
#     unit, so Z-up at 0.0254 m is the parity truth. That is now baked into
#     the .obj files beside this manifest -- see the note on meshes below.
#
# Computed analytically from the meshes and the placements below, from what
# Gazebo actually renders.
verify:
  bounds_min: [-3.2996, -3.3985, -0.5]
  bounds_max: [4.6732, 3.3985, 1.532]
  tolerance: 0.02

# Materials are upstream's, from the same model.sdf as the placements: the nine
# cylinders white, the five decorative hexagons green, the wall flat black. They
# were missing until 2026-09-15 and everything defaulted to white, so Gazebo had
# been rendering this arena wrong too — not only Isaac Sim, which rendered it grey
# because a Gazebo material SCRIPT NAME is not something Isaac can resolve.
# worlds.PALETTE turns these names into RGB once, for both backends.
bodies:
  - name: one_one
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [-1.1, -1.1, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: one_two
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [-1.1, 0, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: one_three
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [-1.1, 1.1, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: two_one
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [0, -1.1, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: two_two
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [0, 0, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: two_three
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [0, 1.1, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: three_one
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [1.1, -1.1, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: three_two
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [1.1, 0, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: three_three
    geometry: {type: cylinder, radius: 0.15, length: 0.5}
    xyz: [1.1, 1.1, 0.25]
    rpy: [0, 0, 0]
    material: Gazebo/White
  - name: head
    geometry: {type: mesh, uri: meshes/hexagon.obj, scale: [0.8, 0.8, 0.8]}
    xyz: [3.5, 0, -0.5]
    rpy: [0, 0, 0]
    material: Gazebo/Green
  - name: left_hand
    geometry: {type: mesh, uri: meshes/hexagon.obj, scale: [0.55, 0.55, 0.55]}
    xyz: [1.8, 2.7, 0]
    rpy: [0, 0, 0]
    material: Gazebo/Green
  - name: right_hand
    geometry: {type: mesh, uri: meshes/hexagon.obj, scale: [0.55, 0.55, 0.55]}
    xyz: [1.8, -2.7, 0]
    rpy: [0, 0, 0]
    material: Gazebo/Green
  - name: left_foot
    geometry: {type: mesh, uri: meshes/hexagon.obj, scale: [0.55, 0.55, 0.55]}
    xyz: [-1.8, 2.7, 0]
    rpy: [0, 0, 0]
    material: Gazebo/Green
  - name: right_foot
    geometry: {type: mesh, uri: meshes/hexagon.obj, scale: [0.55, 0.55, 0.55]}
    xyz: [-1.8, -2.7, 0]
    rpy: [0, 0, 0]
    material: Gazebo/Green
  - name: body
    geometry: {type: mesh, uri: meshes/wall.obj, scale: [0.25, 0.25, 0.25]}
    xyz: [0, 0, -0.3]
    rpy: [0, 0, -1.5708]
    material: Gazebo/FlatBlack
